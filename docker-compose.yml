services:
  postgres:
    image: antifox-postgres:local
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antifox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-antifox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antifox} -d ${POSTGRES_DB:-antifox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  antifox:
    image: ghcr.io/zeerg/antifox:${ANTIFOX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTIFOX_PG_DSN: postgres://${POSTGRES_USER:-antifox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antifox}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTIFOX_LLM_PROVIDER: ${ANTIFOX_LLM_PROVIDER:-}
      ANTIFOX_LLM_MODEL: ${ANTIFOX_LLM_MODEL:-}
      ANTIFOX_LLM_BASE_URL: ${ANTIFOX_LLM_BASE_URL:-}
      ANTIFOX_LLM_PROXY: ${ANTIFOX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      # The traffic proxy (8788) binds container loopback only and is NOT
      # published — it has no client authentication and would be abused as an
      # open proxy if exposed. If remote use is truly needed, add auth + network
      # isolation yourself before publishing it.
    volumes:
      # Bind the data dir (jwt.key, SQLite, ...) to ./data in the project root:
      # easy to inspect/backup on the host and survives container rebuilds.
      - ./data:/app/data
      # Mount the project-root skills dir over the image's /app/skills so skill
      # edits take effect without rebuilding the image.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
